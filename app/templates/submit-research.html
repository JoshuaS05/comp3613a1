{% extends "authenticated-base.html" %}
{% block title %}Submit Research{% endblock %}

{% block subpage_content %}
<section class="container-fluid py-2 submission-page">
  <p class="research-eyebrow mb-1">Research workspace</p>
  <h1 class="h3 mb-4">Submit Research</h1>

  <form class="submission-form" method="POST" action="{{ url_for('submit_research') }}" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label" for="title">Title</label>
      <input class="form-control" type="text" id="title" name="title" maxlength="240" required>
    </div>

    <div class="mb-4">
      <label class="form-label" for="abstract">Abstract</label>
      <textarea class="form-control" id="abstract" name="abstract" rows="5" required></textarea>
    </div>

    <fieldset class="mb-4">
      <legend class="form-label mb-2">Type</legend>
      <div class="d-flex flex-wrap gap-4">
        <div class="form-check">
          <input class="form-check-input" type="radio" id="type-poster" name="submission_type" value="Poster" required>
          <label class="form-check-label" for="type-poster">Poster</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" id="type-presentation" name="submission_type" value="Presentation" required>
          <label class="form-check-label" for="type-presentation">Presentation</label>
        </div>
      </div>
    </fieldset>

    <div class="mb-4">
      <label class="form-label" for="research-file">File</label>
      <input class="form-control" type="file" id="research-file" name="research_file" required>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <a class="btn btn-outline-secondary" href="{{ url_for('user_home_view') }}">Cancel</a>
      <button class="btn btn-primary" type="submit">Submit</button>
    </div>
  </form>
</section>
{% endblock %}
